name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Package plugins
        run: |
          mkdir -p dist

          # Individual plugin zips (plugin source + README) — remaining flat,
          # non-migrated plugin(s). 600-attribution-headers is explicitly not
          # ported to Claude Code per ADR-C08 and stays flat indefinitely.
          for dir in 600-attribution-headers; do
            plugin_name=$(basename "$dir")
            zip -j "dist/${plugin_name}.zip" "${dir}"/*.ts "${dir}"/README.md
          done
          zip -j dist/session-guard.zip \
            adapters/opencode/session-guard/nexus-session-guard.ts \
            adapters/opencode/session-guard/README.md \
            adapters/claude-code/session-guard/nexus-session-guard.ts \
            adapters/claude-code/session-guard/README.md \
            core/logger.ts \
            core/state-store.ts \
            core/session-guard/logic.ts
          zip -j dist/headroom-intercept.zip \
            adapters/opencode/headroom-intercept/nexus-headroom-intercept.ts \
            adapters/opencode/headroom-intercept/README.md \
            adapters/claude-code/headroom-intercept/nexus-headroom-intercept.ts \
            adapters/claude-code/headroom-intercept/README.md \
            core/headroom-intercept/*.ts
          zip -j dist/compaction-plus.zip \
            adapters/opencode/compaction-plus/nexus-compaction-plus.ts \
            adapters/opencode/compaction-plus/README.md \
            adapters/claude-code/compaction-plus/nexus-compaction-plus.ts \
            adapters/claude-code/compaction-plus/README.md \
            core/compaction-plus/*.ts \
            core/logger.ts
          zip -j dist/routing-guard.zip \
            adapters/opencode/routing-guard/nexus-routing-guard.ts \
            adapters/opencode/routing-guard/README.md \
            adapters/claude-code/routing-guard/nexus-routing-guard.ts \
            adapters/claude-code/routing-guard/README.md \
            core/routing-guard/*.ts \
            core/logger.ts
          zip -j dist/cost-control.zip \
            adapters/opencode/cost-control/nexus-cost-control.ts \
            adapters/opencode/cost-control/README.md \
            adapters/claude-code/cost-control/nexus-cost-control.ts \
            adapters/claude-code/cost-control/README.md \
            core/cost-control/*.ts \
            core/logger.ts \
            core/state-store.ts

          # Combined bundle with all plugins
          zip -j dist/nexus-runtime-plugins-all.zip \
            adapters/opencode/session-guard/nexus-session-guard.ts \
            adapters/claude-code/session-guard/nexus-session-guard.ts \
            adapters/opencode/headroom-intercept/nexus-headroom-intercept.ts \
            adapters/claude-code/headroom-intercept/nexus-headroom-intercept.ts \
            adapters/opencode/compaction-plus/nexus-compaction-plus.ts \
            adapters/claude-code/compaction-plus/nexus-compaction-plus.ts \
            adapters/opencode/routing-guard/nexus-routing-guard.ts \
            adapters/claude-code/routing-guard/nexus-routing-guard.ts \
            adapters/opencode/cost-control/nexus-cost-control.ts \
            adapters/claude-code/cost-control/nexus-cost-control.ts \
            core/logger.ts \
            core/state-store.ts \
            core/session-guard/logic.ts \
            core/headroom-intercept/*.ts \
            core/compaction-plus/*.ts \
            core/routing-guard/*.ts \
            core/cost-control/*.ts

      - name: Upload artifacts (branch push)
        if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: nexus-runtime-plugins-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 30

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/600-attribution-headers.zip
            dist/session-guard.zip
            dist/headroom-intercept.zip
            dist/compaction-plus.zip
            dist/routing-guard.zip
            dist/cost-control.zip
            dist/nexus-runtime-plugins-all.zip
