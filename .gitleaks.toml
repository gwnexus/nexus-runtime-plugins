# Gitleaks configuration for nexus-runtime-plugins
# Scans commits for leaked secrets before they reach the repository.

title = "nexus-runtime-plugins gitleaks config"

# Keep the built-in ruleset. A custom config without this replaces the
# defaults and runs with zero rules.
[extend]
useDefault = true

[allowlist]
  description = "Global allowlist"
  # Sentry DSNs are public identifiers, not secrets
  regexTarget = "match"
  regexes = [
    '''NEXT_PUBLIC_SENTRY_DSN''',
    '''SENTRY_DSN''',
  ]
